name: Production Quality Gate & Automated Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        flake8 app tests --max-line-length=120 --ignore=E501,W291,W292,F401

    - name: Static type check with mypy
      run: |
        mypy app --ignore-missing-imports

    - name: Run pytest & generate HTML report
      env:
        PYTHONPATH: .
      run: |
        pytest --cov=app --cov-report=html:htmlcov --html=report.html --self-contained-html tests/

    - name: Upload Test & Coverage HTML Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-and-coverage-report
        path: |
          report.html
          htmlcov/